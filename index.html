<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 My Library</title>
  <style>
    :root {
      --bg: #0f0f17;
      --surface: #1a1a2e;
      --card: #16213e;
      --accent: #e94560;
      --accent2: #0f3460;
      --text: #eaeaea;
      --muted: #888;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      padding: 0 0 60px;
    }
    header {
      background: var(--surface);
      padding: 28px 24px 24px;
      border-bottom: 1px solid #222;
    }
    header h1 { font-size: clamp(22px, 5vw, 32px); font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    header p { margin-top: 6px; color: var(--muted); font-size: 14px; }
    #library {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      padding: 28px 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid #222;
      display: flex;
      flex-direction: column;
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
    .card-cover {
      width: 100%;
      aspect-ratio: 3/4;
      background: var(--accent2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      position: relative;
      overflow: hidden;
    }
    .card-cover img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .progress-bar-wrap { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(255,255,255,.1); }
    .progress-bar-fill { height: 100%; background: var(--accent); transition: width .4s ease; }
    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .card-title { font-size: 15px; font-weight: 600; line-height: 1.35; }
    .card-author { font-size: 12px; color: var(--muted); }
    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--accent2); color: #aac; }
    .card-footer { padding: 0 16px 16px; display: flex; gap: 8px; }
    .btn-read {
      flex: 1; padding: 10px; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; text-decoration: none; text-align: center; transition: opacity .15s;
    }
    .btn-read:hover { opacity: .85; }
    .btn-resume { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .page-badge { font-size: 11px; color: var(--muted); text-align: center; padding: 0 16px 14px; }
    #empty { grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--muted); }
    #loading { text-align: center; padding: 80px 24px; color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>
<header>
  <h1>📚 My <span>Library</span></h1>
  <p>Personal reading shelf — pick up where you left off on any device.</p>
</header>
<div id="loading">Loading books…</div>
<div id="library" style="display:none"></div>
<script>
  const VIEWER = 'viewer.html';
  const pageKey  = id => `lib_page_${id}`;
  const totalKey = id => `lib_total_${id}`;

  async function loadLibrary() {
    const res   = await fetch('books.json');
    const books = await res.json();
    document.getElementById('loading').style.display = 'none';
    const grid = document.getElementById('library');
    grid.style.display = 'grid';
    if (!books.length) {
      grid.innerHTML = `<div id="empty"><div style="font-size:48px">🏜️</div><p>No books yet. Add a PDF and an entry in <code>books.json</code>.</p></div>`;
      return;
    }
    books.forEach(book => {
      const savedPage  = parseInt(localStorage.getItem(pageKey(book.id))  || '1', 10);
      const savedTotal = parseInt(localStorage.getItem(totalKey(book.id)) || '0', 10);
      const pct = savedTotal > 0 ? Math.round((savedPage / savedTotal) * 100) : 0;
      const isStarted = savedPage > 1;
      const readURL   = `${VIEWER}?book=${encodeURIComponent(book.file)}#page=1`;
      const resumeURL = `${VIEWER}?book=${encodeURIComponent(book.file)}#page=${savedPage}`;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-cover">
          ${book.cover ? `<img src="${book.cover}" alt="${book.title}" />` : '📖'}
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="card-body">
          <div class="card-title">${book.title}</div>
          <div class="card-author">${book.author}</div>
          <div class="card-tags">${(book.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        </div>
        ${isStarted ? `<div class="page-badge">Page ${savedPage}${savedTotal ? ' / ' + savedTotal : ''} · ${pct}% read</div>` : ''}
        <div class="card-footer">
          ${isStarted
            ? `<a class="btn-read btn-resume" href="${resumeURL}">▶ Resume</a>
               <a class="btn-read" style="flex:0;padding:10px 14px" href="${readURL}" title="Start from page 1">↺</a>`
            : `<a class="btn-read" href="${readURL}">Start Reading</a>`}
        </div>`;
      grid.appendChild(card);
    });
  }
  loadLibrary().catch(err => { document.getElementById('loading').textContent = `Error: ${err.message}`; });
</script>
</body>
</html>
